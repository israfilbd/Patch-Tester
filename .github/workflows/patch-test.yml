name: Test Frameworks Cherry-Pick

on:
  workflow_dispatch:
    inputs:
      frameworks_repo:
        description: 'Target Frameworks Repo (The one to be patched)'
        required: true
        default: 'https://codeberg.org/LFS-dump/frameworks_base'
      target_branch:
        description: 'Branch to test against'
        required: true
        default: '16'
      fetch_repo:
        description: 'Repo to fetch the commit from'
        required: true
        default: 'https://github.com/ij-project/frameworks_base'
      commit_hash:
        description: 'Commit SHA to cherry-pick'
        required: true
        default: '522af81'

jobs:
  test-cherry-pick:
    runs-on: ubuntu-latest

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          temp-reserve-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'

      - name: Setup Git Identity
        run: |
          git config --global user.email "tester@example.com"
          git config --global user.name "Patch Tester"

      - name: Clone Target Repository (Shallow)
        run: |
          git clone --depth=1 -b ${{ github.event.inputs.target_branch }} ${{ github.event.inputs.frameworks_repo }} base_folder

      - name: Fetch and Cherry-Pick
        working-directory: ./base_folder
        run: |
          echo ">>> Adding source remote..."
          git remote add source_repo ${{ github.event.inputs.fetch_repo }}
          
          echo ">>> Fetching commit (Full Depth)..."
          # Removed --depth here as requested
          git fetch source_repo ${{ github.event.inputs.commit_hash }}
          
          echo ">>> Attempting cherry-pick..."
          if git cherry-pick ${{ github.event.inputs.commit_hash }}; then
            echo "Success: Cherry-pick applied cleanly!"
          else
            echo "::error:: Conflict detected!"
            git diff
            git cherry-pick --abort
            exit 1
          fi

      - name: Verify Result
        if: success()
        working-directory: ./base_folder
        run: |
          git log -n 1 --stat
          
